name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install ruff
      - name: Lint
        run: ruff check custom_components macapp/exporter tests
      - name: Format check
        run: ruff format --check custom_components macapp/exporter tests
      - name: Offline tests
        run: |
          python tests/test_smoke.py
          python tests/test_exporter.py
          python tests/test_flows.py
